<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#07111c"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Ryan AI</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 35% 40%,#12303e,#07111c 65%);color:#e4f5ff;font:16px system-ui;min-height:100dvh;padding:30px}header{display:flex;justify-content:space-between;letter-spacing:3px;color:#81e8df}main{display:grid;grid-template-columns:1fr 1fr;gap:32px;max-width:1200px;margin:40px auto}section{border:1px solid #294452;border-radius:24px;padding:28px;background:#0d1d29aa} .center{text-align:center}#clock{font-size:64px;font-weight:200}small,p{color:#91afc1} .orb{width:180px;height:180px;border-radius:50%;border:1px solid #70f5e7;box-shadow:0 0 50px #29d9cf44,inset 0 0 40px #29d9cf44;margin:36px auto;display:grid;place-items:center}.orb.active{animation:pulse 1.5s infinite}@keyframes pulse{50%{transform:scale(1.05)}}canvas{width:140px;height:70px}button,input{font:inherit;border:1px solid #345567;border-radius:12px;padding:13px;background:#142b39;color:#e4f5ff}button{cursor:pointer}button:hover{background:#235362}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tiles button{min-height:75px}li{margin:12px 0;overflow-wrap:anywhere}li button{padding:5px 10px;margin-left:8px}form{display:flex;gap:8px}input{min-width:0;flex:1} @media(max-width:700px){main{grid-template-columns:1fr}body{padding:16px}}</style><header><b>RYAN AI</b><small>V0.1 / LOCAL</small></header><main><section class="center"><div id="clock"></div><small id="date"></small><div class="orb" id="orb"><canvas id="wave" width="280" height="140"></canvas></div><h2 id="status">待机中</h2><p id="msg">本地原型 · 尚未连接 AI</p><button id="mic">测试麦克风</button> <button id="stop">停止</button><p><button id="speaker">测试扬声器</button></p></section><section><h2>个人工作台</h2><div class="tiles" id="tiles"></div><h3 id="module">工作任务</h3><p id="detail">待办事项保存在本设备。</p><form id="form"><input id="task" placeholder="添加待办事项" required><button>添加</button></form><ul id="list"></ul></section></main><script>const $=id=>document.getElementById(id);function clock(){let d=new Date();$('clock').textContent=d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',hour12:false});$('date').textContent=d.toLocaleDateString('zh-CN',{dateStyle:'full'})}clock();setInterval(clock,1000);let modules={'工作任务':'待办事项保存在本设备。','日程安排':'尚未连接日历。','邮件助手':'尚未连接邮箱。','高尔夫教学':'教学研究与下场营入口，尚未连接数据。','极客工坊':'订单与库存入口，尚未连接数据。','研发中心':'Fairway Flow / Tempo Master / VAELON，尚未连接数据。'};Object.entries(modules).forEach(([k,v])=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>{$('module').textContent=k;$('detail').textContent=v;$('form').hidden=k!=='工作任务';$('list').hidden=k!=='工作任务';$('form').style.display=k==='工作任务'?'flex':'none'};$('tiles').append(b)});let tasks=[];try{tasks=JSON.parse(localStorage.getItem('ryan-tasks')||'[]')}catch{}function render(){ $('list').replaceChildren();tasks.forEach((t,i)=>{let li=document.createElement('li');li.textContent=t;let b=document.createElement('button');b.textContent='完成';b.onclick=()=>{tasks.splice(i,1);save()};li.append(b);$('list').append(li)})}function save(){try{localStorage.setItem('ryan-tasks',JSON.stringify(tasks))}catch{$('detail').textContent='存储不可用，仅本次会话有效。'}render()}$('form').onsubmit=e=>{e.preventDefault();if($('task').value.trim())tasks.push($('task').value.trim());$('task').value='';save()};render();let stream,ctx,raf,epoch=0;let c=$('wave').getContext('2d');function idle(){c.clearRect(0,0,280,140);c.strokeStyle='#70f5e7';c.beginPath();c.moveTo(10,70);c.lineTo(270,70);c.stroke()}idle();function stop(){epoch++;cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());if(ctx)ctx.close().catch(()=>{});stream=null;ctx=null;$('orb').classList.remove('active');$('status').textContent='待机中';$('msg').textContent='麦克风已停止';idle()}$('stop').onclick=stop;$('mic').onclick=async()=>{stop();let e=epoch;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('请使用 HTTPS 网页打开');let s=await navigator.mediaDevices.getUserMedia({audio:true});if(e!==epoch){s.getTracks().forEach(t=>t.stop());return}stream=s;ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();let a=ctx.createAnalyser();a.fftSize=256;ctx.createMediaStreamSource(stream).connect(a);let data=new Uint8Array(a.fftSize);$('status').textContent='正在聆听';$('msg').textContent='仅测试音量波形，不录音、不上传';$('orb').classList.add('active');function draw(){a.getByteTimeDomainData(data);c.clearRect(0,0,280,140);c.strokeStyle='#70f5e7';c.beginPath();data.forEach((v,i)=>{let x=i/(data.length-1)*280,y=v/256*140;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();raf=requestAnimationFrame(draw)}draw()}catch(err){stop();$('msg').textContent='麦克风不可用：'+err.message}};$('speaker').onclick=()=>{if(!window.speechSynthesis){$('msg').textContent='语音合成不可用';return}let u=new SpeechSynthesisUtterance('你好，我是 Ryan AI。扬声器测试。');u.lang='zh-CN';speechSynthesis.speak(u)};window.addEventListener('pagehide',stop);if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});</script></html>
